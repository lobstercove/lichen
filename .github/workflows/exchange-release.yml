name: Exchange Integration Release

on:
  push:
    tags:
      - "exchange-testnet-v*"

permissions:
  contents: read

jobs:
  package:
    name: Validate and package exchange integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate exchange package source
        run: |
          python3 -m unittest scripts.qa.test_exchange_public_readiness
          node scripts/qa/test_public_claims.js
          node scripts/qa/test_developer_surface_coverage.js
          node scripts/qa/test_exchange_release_assets.js

      - name: Package exchange integration
        run: node scripts/package-exchange-release.mjs --release-tag "${GITHUB_REF_NAME}"

      - name: Attest exchange archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/exchange/lichen-exchange-testnet-*.tar.gz

      - name: Attest exchange checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/exchange/SHA256SUMS

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lichen-exchange-integration-release
          path: |
            dist/exchange/lichen-exchange-testnet-*.tar.gz
            dist/exchange/SHA256SUMS
          if-no-files-found: error

  release:
    name: Create draft exchange release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lichen-exchange-integration-release

      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          draft: true
          generate_release_notes: true
          files: |
            lichen-exchange-testnet-*.tar.gz
            SHA256SUMS
          body: |
            ## Lichen Exchange Testnet Integration ${{ github.ref_name }}

            This package is the source-backed native LICN integration and operations bundle for public testnet.
            Mainnet is not included.

            Before publication, attach the final public readiness report and detached ML-DSA checksum signature
            `SHA256SUMS.sig`. Do not make the release public in order to generate that report. Verify the local
            candidate, trust anchor, and artifact provenance first:

            ```bash
            node scripts/verify-release-checksums.mjs .
            gh attestation verify lichen-exchange-testnet-*.tar.gz -R lobstercove/lichen
            python3 scripts/qa/exchange_public_readiness.py \
              --scope testnet --status-approved --release-stage candidate \
              --candidate-dir . --report exchange-public-readiness-report.json
            ```

            Attach `SHA256SUMS.sig` and `exchange-public-readiness-report.json` to this draft, confirm that all
            four required assets are present, and only then publish it. After publication, rerun the readiness
            gate with `--release-stage published`.
