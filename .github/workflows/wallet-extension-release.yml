name: Wallet Extension Release

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: Release tag to validate against the manifest version (for example wallet-extension-v0.1.0)
                required: false
                type: string
    push:
        tags:
            - "wallet-extension-v*"

permissions:
    contents: read

jobs:
    package:
        name: Package Wallet Extension
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: "22"

            - name: Build JavaScript SDK
              run: cd sdk/js && npm ci --ignore-scripts && npm run build

            - name: Run wallet release validation
              run: |
                  node scripts/qa/test_wallet_release_docs.js
                  node scripts/qa/test_wallet_extension_audit.js
                  node scripts/qa/test_wallet_extension_signing_e2e.js
                  node scripts/qa/test_wallet_audit.js

            - name: Package extension release artifacts
              run: |
                  if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
                    node scripts/package-wallet-extension.mjs --release-tag "${{ github.event.inputs.release_tag }}"
                  elif [[ "${GITHUB_REF_NAME}" == wallet-extension-v* ]]; then
                    node scripts/package-wallet-extension.mjs --release-tag "${GITHUB_REF_NAME}"
                  else
                    node scripts/package-wallet-extension.mjs
                  fi

            - name: Prepare public release artifacts
              run: |
                  cd dist/wallet-extension
                  runtime_zip="$(ls LichenWallet-extension-v*.zip)"
                  sha256sum "${runtime_zip}" > SHA256SUMS
                  rm -f LichenWallet-extension-store-submission-*.zip latest.json

            - name: Attest wallet runtime archive
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
              with:
                  subject-path: dist/wallet-extension/LichenWallet-extension-v*.zip

            - name: Attest wallet checksums
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
              with:
                  subject-path: dist/wallet-extension/SHA256SUMS

            - name: Upload packaged artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: lichen-wallet-extension-release
                  path: |
                      dist/wallet-extension/LichenWallet-extension-v*.zip
                      dist/wallet-extension/SHA256SUMS
                  if-no-files-found: error

    release:
        name: Draft Wallet Extension Release
        needs: package
        if: startsWith(github.ref, 'refs/tags/wallet-extension-v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download packaged artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: lichen-wallet-extension-release

            - name: Create draft release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
              with:
                  draft: true
                  generate_release_notes: true
                  files: |
                      LichenWallet-extension-*.zip
                      SHA256SUMS
                  body: |
                      ## LichenWallet Extension ${{ github.ref_name }}

                      This public release packages the browser extension ZIP for manual installation.

                      ### Included Artifacts

                      - `LichenWallet-extension-v*.zip`: runtime extension ZIP
                      - `SHA256SUMS`: checksum for the runtime ZIP
                      - `SHA256SUMS.sig`: detached ML-DSA checksum signature attached before publication

                      Verify the checksum signature against `deploy/release-trust-anchor.json`, then verify GitHub
                      artifact provenance with:

                      ```bash
                      gh attestation verify LichenWallet-extension-v*.zip -R lobstercove/lichen
                      ```

                      ### Auto Update

                      - Chrome Web Store: automatic updates after this version is published
                      - Microsoft Edge Add-ons: automatic updates after this version is published
                      - Unpacked or direct ZIP installs: manual updates only
