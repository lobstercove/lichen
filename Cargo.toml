[workspace]
members = [
    "core",
    "validator",
    "rpc",
    "cli",
    "p2p",
    "faucet-service",
    "custody",
    "genesis",
]
exclude = [
    "contracts/*",
    "sdk",
    "compiler",
    "third_party/arrayref",
]

resolver = "2"

# Workspace-wide dependencies
[workspace.dependencies]
tempfile = "3.8"
ed25519-dalek = "2.1"
ml-dsa = "=0.1.0-rc.8"
slh-dsa = "=0.2.0-rc.4"
# ml-dsa rc.8 and slh-dsa rc.4 do not compile against pkcs8 0.11.0 final.
# Keep their shared prerelease API exact until both PQ crates are upgraded together.
pkcs8 = "=0.11.0-rc.11"
dilithium = { package = "dilithium-rs", version = "0.2.0" }

# crates.io yanked every legitimate arrayref release on 2026-08-20 and the
# replacement 0.3.10 depends on a nonexistent `proc-macro1` package. Keep the
# previously locked, reviewed 0.3.9 implementation in-tree until upstream
# restores a trustworthy registry release.
[patch.crates-io]
arrayref = { path = "third_party/arrayref" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
